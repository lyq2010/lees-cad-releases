name: Lee's CAD macOS Packaging Check
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package-check:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lyq2010/lees-cad
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.LEESCAD_SOURCE_SSH_KEY }}
          path: private-source
          persist-credentials: false
          show-progress: false
      - name: Same installer dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --only-binary=:all: -r private-source/packaging/macos/dmg/requirements.txt
      - name: Isolated packaging fixture
        shell: bash
        env:
          LEES_CAD_BUILD_SHA: ${{ inputs.source_sha }}
          MACOS_SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          [[ "$LEES_CAD_BUILD_SHA" =~ ^[a-f0-9]{40}$ ]]
          fixture="$RUNNER_TEMP/cad-package-check"
          mkdir -p "$fixture/target/aarch64-apple-darwin/release"
          printf 'int main(void) { return 0; }\n' > "$fixture/fixture.c"
          xcrun clang "$fixture/fixture.c" -o "$fixture/target/aarch64-apple-darwin/release/lees-cad"
          cp "$fixture/target/aarch64-apple-darwin/release/lees-cad" "$fixture/target/aarch64-apple-darwin/release/lees-cad-cli"
          export CARGO_TARGET_DIR="$fixture/target" DIST="$fixture/dist"
          for interpreter in python python3; do
            "$interpreter" -c 'import sys,importlib.util,json; print(json.dumps({"python":sys.executable,"ds_store":bool(importlib.util.find_spec("ds_store")),"mac_alias":bool(importlib.util.find_spec("mac_alias"))}))'
          done
          set +e
          bash -x private-source/packaging/macos/package.sh --arch aarch64 --skip-build > "$fixture/package.log" 2>&1
          result=$?
          set -e
          python3 - "$fixture/package.log" "$result" <<'PY'
          import json,re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(errors="replace")
          commands=re.findall(r"^\++ ([a-zA-Z_][a-zA-Z0-9_]*)",text,re.M)
          print(json.dumps({
              "result":int(sys.argv[2]),
              "lastCommands":commands[-12:],
              "missingModules":re.findall(r"ModuleNotFoundError: No module named '([a-zA-Z0-9_.]+)'",text),
              "exceptionTypes":re.findall(r"^([a-zA-Z_][a-zA-Z0-9_]*(?:Error|Exception)):",text,re.M),
              "unboundVariables":re.findall(r"([a-zA-Z_][a-zA-Z0-9_]*): unbound variable",text),
              "categories":[s for s in ["No space left on device","Permission denied","No such file or directory","resource fork, Finder information, or similar detritus not allowed","Resource temporarily unavailable","not mounted"] if s in text]
          }))
          PY
          df -k "$RUNNER_TEMP" | tail -n 1
          exit "$result"
