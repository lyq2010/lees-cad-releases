name: Lee's CAD 双平台闭源发行

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 私有源码仓固定的 40 位提交 SHA
        required: true
        type: string
      publish:
        description: 经明确授权后上传 COS/R2 并发布；CI 验证保持 false
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: lees-cad-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - id: identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      LEESCAD_UPDATER_PRIVATE_KEY: ${{ secrets.LEESCAD_UPDATER_PRIVATE_KEY }}
      LEESCAD_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.LEESCAD_UPDATER_PRIVATE_KEY_PASSWORD }}
      LEESCAD_WINDOWS_PFX_BASE64: ${{ secrets.LEESCAD_WINDOWS_PFX_BASE64 }}
      LEESCAD_WINDOWS_PFX_PASSWORD: ${{ secrets.LEESCAD_WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: release-repo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lyq2010/lees-cad
          ref: ${{ needs.validate.outputs.revision }}
          ssh-key: ${{ secrets.LEESCAD_SOURCE_SSH_KEY }}
          path: private-source
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: 固定 Minisign 工具
        shell: pwsh
        run: release-repo/release-tools/lees-cad/setup-minisign.ps1
      - name: 私有构建及双端契约回归
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.revision }}
        run: |
          git -C private-source remote set-url origin https://github.com/lyq2010/lees-cad.git
          release-repo/release-tools/lees-cad/build.ps1 -Source private-source -Revision $env:SOURCE_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lees-cad-windows
          path: |
            public-assets/lees-cad-*-windows-x64.msi
            public-assets/lees-cad-*-windows-x64.msi.minisig
            public-assets/lees-cad-*-windows-x64-portable.zip
            public-assets/lees-cad-*-windows-x64-portable.zip.minisig
            public-assets/windows-x86_64.json
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 90
    env:
      LEESCAD_UPDATER_PRIVATE_KEY: ${{ secrets.LEESCAD_UPDATER_PRIVATE_KEY }}
      LEESCAD_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.LEESCAD_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: release-repo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lyq2010/lees-cad
          ref: ${{ needs.validate.outputs.revision }}
          ssh-key: ${{ secrets.LEESCAD_SOURCE_SSH_KEY }}
          path: private-source
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: 固定 Minisign 工具
        shell: pwsh
        run: release-repo/release-tools/lees-cad/setup-minisign.ps1
      - name: 私有构建及双端契约回归
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.revision }}
        run: |
          git -C private-source remote set-url origin https://github.com/lyq2010/lees-cad.git
          release-repo/release-tools/lees-cad/build.ps1 -Source private-source -Revision $env:SOURCE_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lees-cad-macos
          path: |
            public-assets/lees-cad-*-macos-aarch64.dmg
            public-assets/lees-cad-*-macos-aarch64.dmg.minisig
            public-assets/lees-cad-*-macos-aarch64.app.tar.gz
            public-assets/lees-cad-*-macos-aarch64.app.tar.gz.minisig
            public-assets/lees-cad-cli-*-macos-aarch64.zip
            public-assets/lees-cad-cli-*-macos-aarch64.zip.minisig
            public-assets/darwin-aarch64.json
          if-no-files-found: error
          retention-days: 7

  verify-artifacts:
    needs: [validate, build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
      LEESCAD_RELEASE_PRIVATE_KEY: ${{ secrets.LEESCAD_RELEASE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lees-cad-*
          path: public-assets
          merge-multiple: true
      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - name: 镜像清理范围与分页回归
        run: python3 release-tools/lees-cad/test-prune.py
      - name: 合并同一源码的双平台清单并验签
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.revision }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("public-assets/windows-x86_64.json")).version')
          node release-tools/lees-cad/manifest.mjs public-assets "$version" "$SOURCE_SHA"
          node release-tools/lees-cad/verify.mjs public-assets > public-assets/verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lees-cad-verified
          path: |
            public-assets/lees-cad-*.msi
            public-assets/lees-cad-*.msi.minisig
            public-assets/lees-cad-*.dmg
            public-assets/lees-cad-*.dmg.minisig
            public-assets/lees-cad-*.app.tar.gz
            public-assets/lees-cad-*.app.tar.gz.minisig
            public-assets/lees-cad-*-portable.zip
            public-assets/lees-cad-*-portable.zip.minisig
            public-assets/lees-cad-cli-*.zip
            public-assets/lees-cad-cli-*.zip.minisig
            public-assets/windows-x86_64.json
            public-assets/darwin-aarch64.json
            public-assets/release-manifest.json
            public-assets/SHA256SUMS
            public-assets/verification.json
          if-no-files-found: error
          retention-days: 7

  mirror-cos:
    if: ${{ inputs.publish }}
    needs: verify-artifacts
    runs-on: ubuntu-latest
    env:
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lees-cad-verified
          path: public-assets
      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 -m pip install cos-python-sdk-v5==1.9.38
      - run: python3 release-tools/lees-cad/mirror.py stage cos public-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lees-cad-ready-cos
          path: public-assets/readiness-cos.json

  mirror-r2:
    if: ${{ inputs.publish }}
    needs: verify-artifacts
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lees-cad-verified
          path: public-assets
      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 release-tools/lees-cad/mirror.py stage r2 public-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lees-cad-ready-r2
          path: public-assets/readiness-r2.json

  promote:
    if: ${{ inputs.publish }}
    needs: [mirror-cos, mirror-r2]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lees-cad-verified
          path: public-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lees-cad-ready-*
          path: public-assets
          merge-multiple: true
      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 -m pip install cos-python-sdk-v5==1.9.38
      - run: python3 release-tools/lees-cad/mirror.py promote cos public-assets
      - run: python3 release-tools/lees-cad/mirror.py promote r2 public-assets
      - name: 仅上传公开白名单资产
        run: node release-tools/lees-cad/publish.mjs public-assets

  cleanup-cos:
    if: ${{ inputs.publish }}
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lees-cad-verified
          path: public-assets
      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 -m pip install cos-python-sdk-v5==1.9.38
      - run: python3 release-tools/lees-cad/prune.py cos public-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lees-cad-cleanup-cos
          path: public-assets/cleanup-cos.json
          retention-days: 7

  cleanup-r2:
    if: ${{ inputs.publish }}
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lees-cad-verified
          path: public-assets
      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python3 release-tools/lees-cad/prune.py r2 public-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lees-cad-cleanup-r2
          path: public-assets/cleanup-r2.json
          retention-days: 7
